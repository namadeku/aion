# Builds the installer for a v* tag and publishes it as a GitHub release.
# Installed copies of Aion find the release through the GitHub API and update themselves.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Version must match the tag
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "pyproject.toml has $version, tag is ${{ github.ref_name }}" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the web UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Python dependencies
        run: uv sync --locked --extra cloud

      - name: Tests
        run: uv run pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne "Valid") { throw "Inno Setup signature is not valid" }
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/SP-" -Wait

      - name: Build the installer
        run: uv run python scripts/build_installer.py

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/Aion-Setup-$env:VERSION.exe" "dist/Aion-Setup-$env:VERSION.exe.sha256" `
            --title "Aion $env:VERSION" --notes-file RELEASE_NOTES.md
