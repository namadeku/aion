[project]
name = "aion"
version = "0.2.5"
description = "Offline-first desktop voice assistant in the spirit of J.A.R.V.I.S. with a plugin system"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "namadeku", email = "133955039+namadeku@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "edge-tts>=7.2.8",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mcp>=2.3.0",
    "miniaudio>=1.71",
    "num2words>=0.5.14",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",
    "pycaw>=20260927 ; sys_platform == 'win32'",
    "pydantic>=2.13.5",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.4",
    "pywebview>=6.2.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
    "vosk>=0.3.45",
    "watchfiles>=1.3.0",
    "webrtcvad-wheels>=2.0.14.post1",
    "winrt-runtime>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-media-control>=3.2.1 ; sys_platform == 'win32'",
]

[project.scripts]
aion = "aion.cli:main"

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]
cloud = [
    "anthropic>=1.11.0",
    "openai>=3.24.0",
]
silero = [
    "torch>=2.4",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pre-commit>=4.6.2",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PT"]
# RUF001-003: Cyrillic text is intentional. PLC0415: optional heavy deps are imported lazily.
# PLE1205: false positive for loguru's "{}" formatting. PLR0911: match/case dispatchers.
ignore = ["PLR2004", "PLR0913", "PLR0917", "PLR0911", "PLC0415", "PLE1205", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/aion/plugins/builtin/calc/units.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
