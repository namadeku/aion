# Character voice presets: an existing voice + rate + pitch + effect under our own name.
#
# Only voices whose licence allows use in an MIT-licensed application are offered as free
# presets. Licences were read from the voices' MODEL_CARD files (rhasspy/piper-voices):
#   ru_RU-denis-medium  CC0           allowed
#   ru_RU-dmitri-medium CC0           allowed
#   ru_RU-ruslan-medium CC BY-NC-SA   NOT used (non-commercial, share-alike)
#   ru_RU-irina-medium  Unknown       NOT used (no licence stated)
# Silero v4 is CC BY-NC-SA 4.0 (non-commercial): presets on it carry `non_commercial: true`.
# Edge TTS is an online Microsoft service: presets on it carry `online: true`.
# Names are our own; no third-party characters, trademarks or voice samples.
#
# Fields: id, title, description, engine, voice, rate, pitch, effect (none|metallic|radio|digital),
# license (of the voice), non_commercial (default false), online (default false).

presets:
  - id: butler
    title: Дворецкий
    description: Неторопливый, сдержанный и вежливый голос.
    engine: piper
    voice: ru_RU-dmitri-medium
    rate: 0.92
    pitch: -1.5
    effect: none
    license: CC0

